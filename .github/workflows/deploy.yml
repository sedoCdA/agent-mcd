name: Sync to Hugging Face Hub

on:
  push:
    branches: [ "main" ] # Triggers the pipeline on every push to your main branch

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  deploy-to-hf:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Ensures your faiss_index vector files are synced correctly if they use Git LFS

      - name: Push to Hugging Face Spaces
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Adityaa13/agent-mcd # <--- ⚠️ REPLACE THIS WITH YOUR DETAILS
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker